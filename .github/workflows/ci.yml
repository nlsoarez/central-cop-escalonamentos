name: Validacao Central COP
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de regras
        run: node --test tests/*.test.mjs
      - name: Sintaxe JavaScript
        run: |
          node --check src/core.mjs
          node --check src/store.mjs
          node --check src/app.mjs
