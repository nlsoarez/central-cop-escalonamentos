name: Publicar portal estatico
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configurar chave publicável do Supabase independente
        env:
          COP_SUPABASE_URL: ${{ vars.COP_SUPABASE_URL }}
          COP_SUPABASE_ANON_KEY: ${{ vars.COP_SUPABASE_ANON_KEY }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('config.js','window.CENTRAL_COP_CONFIG = '+JSON.stringify({supabaseUrl:process.env.COP_SUPABASE_URL||'',supabaseAnonKey:process.env.COP_SUPABASE_ANON_KEY||''})+';\\n')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
